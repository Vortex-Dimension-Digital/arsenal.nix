name: Update packages

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package to update; leave empty to update all packages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: packages
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ -n "$REQUESTED_PACKAGE" ]]; then
            packages=$(jq --compact-output --null-input \
              --arg package "$REQUESTED_PACKAGE" \
              '[$package]')
          else
            packages=$(./scripts/update.py --list-updates)
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    env:
      PACKAGE: ${{ matrix.package }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Update ${{ matrix.package }}
        run: nix run .#update -- "$PACKAGE"

      - name: Regenerate README package table
        run: ./scripts/generate-package-docs.py

      - name: Read package version
        id: package
        run: |
          version=$(nix eval --raw ".#$PACKAGE.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "${{ matrix.package }}: update to ${{ steps.package.outputs.version }}"
          title: "${{ matrix.package }}: update to ${{ steps.package.outputs.version }}"
          body: Automated update of `${{ matrix.package }}` to `${{ steps.package.outputs.version }}`.
          branch: "updates/${{ matrix.package }}"
          delete-branch: true
          labels: |
            automated
            dependencies

      - name: Run pull request checks
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml \
            --ref "$PR_BRANCH" \
            --field package="$PACKAGE" \
            --field pull-request-number="$PR_NUMBER"