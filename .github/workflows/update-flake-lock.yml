name: Update flake inputs

on:
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: nix flake update

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: Automated weekly update of the pinned flake inputs.
          branch: updates/flake-lock
          delete-branch: true
          labels: |
            automated
            dependencies

      - name: Run pull request checks
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml \
            --ref "$PR_BRANCH" \
            --field pull-request-number="$PR_NUMBER"
