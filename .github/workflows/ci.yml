name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Updated package whose automated pull request branch is checked; leave empty for flake-lock updates
      pull-request-number:
        description: Automated pull request to merge after checks pass

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let main finish so every build result reaches the binary cache.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SYSTEM: x86_64-linux

jobs:
  eval:
    name: Evaluate
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          use-gha-cache: true
      # The same Git hooks that `nix develop` installs: Nix formatting and the
      # generated README package table.
      - name: Run Git hooks
        run: nix develop --command pre-commit run --all-files --show-diff-on-failure
      - name: Plan uncached builds
        id: plan
        run: |
          nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
            --flake ".#checks.$SYSTEM" --check-cache-status --workers 2 \
            | ./scripts/ci-build-plan.py > groups.json
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"
      # Runs after planning, which realises the sources that evaluation imports
      # (import-from-derivation); --no-build cannot fetch them itself.
      - name: Check flake outputs
        run: nix flake check --no-build

  build:
    name: Build ${{ matrix.group.name }}
    needs: eval
    if: needs.eval.outputs.groups != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.eval.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Build checks
        env:
          ATTRS: ${{ matrix.group.attrs }}
        run: |
          installables=()
          for attr in $ATTRS; do
            installables+=(".#checks.$SYSTEM.$attr")
          done
          nix build --no-link --keep-going --print-build-logs "${installables[@]}"

  check:
    needs: [eval, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require evaluation and builds to succeed
        env:
          EVAL_RESULT: ${{ needs.eval.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "eval: $EVAL_RESULT, build: $BUILD_RESULT"
          [[ "$EVAL_RESULT" == success ]]
          [[ "$BUILD_RESULT" == success || "$BUILD_RESULT" == skipped ]]

  auto-merge:
    name: Auto-merge update
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.pull-request-number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          PACKAGE: ${{ inputs.package }}
        run: |
          expected_branch="updates/${PACKAGE:-flake-lock}"
          metadata=$(gh pr view "$PR_NUMBER" \
            --json author,baseRefName,headRefName,isCrossRepository \
            --jq '[.author.is_bot, .isCrossRepository, .baseRefName, .headRefName] | @tsv')
          if [[ "$metadata" != $'true\tfalse\tmain\t'"$expected_branch" ]]; then
            echo "Pull request is not an automated update for $expected_branch" >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$GITHUB_SHA"
